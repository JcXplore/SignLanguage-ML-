[project]
name = "signbridge-ml"
version = "0.1.0"
description = "Training pipeline for SignBridge's offline FSL sign recognizer"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26",
  "mediapipe>=0.10.30",
  "opencv-python-headless>=4.9",
  "tensorflow>=2.20,<2.22",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
py-modules = ["features"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
