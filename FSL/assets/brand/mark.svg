      <line x1="380" y1="300" x2="380" y2="600"/>
      <line x1="484" y1="250" x2="484" y2="600"/>
      <line x1="588" y1="280" x2="588" y2="600"/>
      <line x1="692" y1="350" x2="692" y2="600"/>
      <line x1="372" y1="660" x2="262" y2="500"/>
